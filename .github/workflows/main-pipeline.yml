name: Main Pipeline (Test, Release, Deploy)

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write 
  pull-requests: write 

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # PARALLEL VALIDATION JOBS
  validate-static:
    name: Static Analysis & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate GitHub Actions Syntax
        uses: reviewdog/action-actionlint@v1
        with:
          fail_on_error: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Verify Formatting & Linting
        run: npm run format:check && npm run lint
      - name: Run npm audit
        run: npm run audit
      - name: Run TypeScript Typechecking
        run: npm run typecheck

  validate-unit:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Run Vitest & Coverage
        run: npm run test:coverage
      - name: Report Code Coverage
        uses: davelosert/vitest-coverage-report-action@v2
        if: success()

  validate-e2e:
    name: E2E Tests & Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Verify Production Build
        run: npm run build
      - name: Run Lighthouse & Size Audits
        run: npx lhci autorun && npm run size
      - name: Run Playwright E2E Tests
        run: npm run test:e2e

  # SEQUENTIAL RELEASE JOB
  release:
    name: Semantic Release
    needs: [validate-static, validate-unit, validate-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Semantic Release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          HUSKY: 0
        run: npx semantic-release

  # SEQUENTIAL DEPLOYMENT JOB
  deploy:
    name: Deploy to GitHub Pages
    needs: [release]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
