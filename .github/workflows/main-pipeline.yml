name: Main Pipeline (Test, Release, Deploy)

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write 
  pull-requests: write 

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-static:
    name: Static Analysis & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate GitHub Actions Workflow Syntax (actionlint)
        uses: reviewdog/action-actionlint@v1
        with:
          fail_on_error: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify Prettier Formatting (src/**/*.js, css, html)
        run: npm run format:check
      - name: Run ESLint, Stylelint, HTML-Validate, and CSpell
        run: npm run lint
      - name: Run npm audit (High+ Vulnerabilities)
        run: npm run audit
      - name: Run TypeScript Typechecking (tsc)
        run: npm run typecheck

  validate-unit:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest Unit Tests (tests/unit/**/*.test.js)
        run: npm run test
      - name: Generate Vitest Coverage Report
        run: npm run test:coverage
      - name: Report Code Coverage
        uses: davelosert/vitest-coverage-report-action@v2
        if: success()

  validate-e2e:
    name: E2E Tests & Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Verify Production Build (vite build)
        run: npm run build
      - name: Lighthouse CI Audit
        run: npx lhci autorun
      - name: Upload Lighthouse CI Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-audit-reports
          path: .lighthouseci/
          retention-days: 7
      - name: Audit Production Bundle Size (size-limit)
        run: npm run size
      - name: Run Playwright E2E Tests (tests/e2e/**/*.spec.js)
        run: npm run test:e2e
      - name: Upload Playwright Test Report & Traces (On Failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  validate-codeql:
    name: CodeQL Security Audit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

  release:
    name: Semantic Release
    needs: [validate-static, validate-unit, validate-e2e, validate-codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          HUSKY: 0
        run: npx semantic-release

  deploy:
    name: Deploy to GitHub Pages
    needs: [release]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4