name: CI Quality Pipeline

on:
  push:
    branches: [ main, "feat/*", "fix/*", "build/*", "chore/*", "ci/*" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: 1. Verify Code Formatting (Prettier)
        run: npm run format:check

      - name: 2. Run JS Static Code Analysis (ESLint)
        run: npm run lint

      - name: 3. Run CSS Static Analysis (Stylelint)
        run: npx stylelint "src/**/*.css" || true

      - name: 4. Validate HTML Markup & Accessibility
        run: npx html-validate index.html

      - name: 5. Verify Strict JSDoc Type Safety (TSC)
        run: npm run typecheck

      - name: 6. Execute Automated Unit & Integration Tests
        run: npm run test

      - name: 7. Run Dependency Security Audit
        run: npm run audit

      - name: 8. Verify Production Build Integrity
        run: npm run build
