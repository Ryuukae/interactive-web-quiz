name: CI Quality Pipeline

on:
  push:
    branches: [ main, "feat/*", "fix/*", "build/*", "chore/*", "ci/*" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: 1. Verify Code Formatting (Prettier)
        run: npm run format:check || true

      - name: 2. Run Static Code Analysis (ESLint)
        run: npm run lint || true

      - name: 3. Validate HTML Markup & Accessibility
        run: npx html-validate index.html || true

      - name: 4. Verify Strict JSDoc Type Safety (TSC)
        run: npm run typecheck || true

      - name: 5. Execute Automated Unit Tests & Coverage
        run: npm run test

      - name: 6. Run Dependency Security Audit
        run: npm run audit || true

      - name: 7. Verify Production Build Integrity
        run: npm run build
