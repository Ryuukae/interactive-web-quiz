name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  enforce-branch-flow:
    name: Enforce Main PR Source Branch
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - name: Verify PR originates from dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Direct merges into 'main' are restricted. Pull requests targeting 'main' must originate from 'dev'."
            exit 1
          fi
          echo "PR source is 'dev'. Approved to proceed."

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint PR Commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
