name: Visual Regression Audits

on:
  pull_request:
    branches: [ main ]
  # Allows you to manually trigger the workflow from the GitHub UI
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update baselines and commit to branch?'
        type: boolean
        default: false

jobs:
  execute-visual-audits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # Required to pull the actual LFS images
          ref: ${{ github.head_ref || github.ref }} # Check out the PR branch
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # RUN STANDARD TESTS
      - name: Run Visual Regression Checks against Baselines
        if: ${{ !inputs.update_snapshots }}
        run: npx playwright test

      # RUN UPDATE WORKFLOW (Only if manually triggered)
      - name: Generate New Ubuntu Snapshot Baselines
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test --update-snapshots

      # AUTO-COMMIT NEW SNAPSHOTS BACK TO PR
      - name: Auto-commit Baselines to Branch
        if: ${{ inputs.update_snapshots }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "test(visuals): update playwright baseline snapshots"
          file_pattern: "**/*.png"

      # UPLOAD DIFF REPORT ON FAILURE
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: failure() # Only uploads if the tests actually fail
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7