name: "CodeQL Security Audit"

on:
  push:
    branches: ["dev"]
    paths:
      - "**/*.js"
      - "**/*.html"
      - ".github/workflows/codeql.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "**/*.js"
      - "**/*.html"
      - ".github/workflows/codeql.yml"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sundays unconditionally

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          # Enable the extended security and maintainability ruleset
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
