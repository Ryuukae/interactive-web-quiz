<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding explicitly set to support a wide range of text characters -->
    <meta charset="utf-8">
    
    <!-- Viewport configuration critical for responsive design and mobile hardware scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Interactive Quiz</title>
    
    <!-- External stylesheet linkage (CSSOM rendering pipeline) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 
      ROOT CONTAINER
      Acts as the primary wrapper for the application layout. Confines the UI bounds
      and provides a stable backdrop for the glassmorphism rendering.
    -->
    <div class="container">

        <!-- ========================================== -->
        <!-- STAGE 1: START SCREEN (INITIAL STATE)      -->
        <!-- ========================================== -->
        <!-- The 'active' class dictates visibility upon initial DOM load. -->
        <div class="screen active" id="start-screen">
            <h1>Quiz Time!</h1>
            <p>Test your knowledge with these fun questions</p>
            
            <!-- 
              ACTION STACK
              A structural flex-container designed to group primary and secondary 
              actions while enforcing consistent vertical rhythm.
            -->
            <div class="action-stack">
                
                <!-- Primary Call to Action (CTA): Initializes the default quiz flow -->
                <button id="start-btn">Start Quiz</button>
                
                <!-- 
                  FILE UPLOAD ARCHITECTURE
                  The native <input type="file"> is hidden from the UI because default browser 
                  rendering cannot be consistently styled across platforms. 
                  We restrict the payload to JSON format via the 'accept' attribute.
                -->
                <input type="file" id="custom-file-input" accept=".json" hidden>
                
                <!-- 
                  PROXY TRIGGER
                  The <label> element is programmatically linked to the hidden input via the 'for' attribute. 
                  Clicking this styled label seamlessly delegates the click event to the native file browser.
                -->
                <label for="custom-file-input" class="secondary-btn">Upload Custom JSON</label>
                
                <!-- Dedicated output node for JS to inject the parsed file name, providing user feedback -->
                <span id="file-name-display" class="file-status"></span>
            </div>
        </div>
        
        <!-- ========================================== -->
        <!-- STAGE 2: QUIZ SCREEN (ACTIVE STATE)        -->
        <!-- ========================================== -->
        <div class="screen" id="quiz-screen">
            
            <!-- QUIZ HEADER: Houses the dynamic question text and real-time metadata -->
            <div class="quiz-header">
                <!-- Text node updated dynamically by QuizState progression -->
                <h2 id="question-text">Question goes here...</h2>
            
                <!-- Metadata container: Tracks chronological progress and current scoring -->
                <div class="quiz-info">
                    <p>Question <span id="current-question">#</span> of <span id="totalQuestionsSpan">#</span></p>
                    <p>Score: <span id="score">#</span></p>
                </div>
            </div>

            <!-- 
              ANSWERS CONTAINER
              Acts as an empty DOM injection target. UIController.js will dynamically 
              construct and append interactive <button> elements here based on the JSON payload.
            -->
            <div id="answers-container" class="answers-container">
                <!-- Answer buttons will be populated using JS -->
            </div>

            <!-- 
              PROGRESS BAR
              Visual indicator of quiz completion. The inner '.progress' div's width is 
              manipulated via inline CSS transitions handled in script.js.
            -->
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- STAGE 3: RESULTS SCREEN (TERMINAL STATE)   -->
        <!-- ========================================== -->
        <div id="result-screen" class="screen">
            <h1>Quiz Results</h1>
            
            <!-- 
              RESULTS CONTENT
              A recessed UI component displaying the final computed metrics.
            -->
            <div class="result-info">
                <p>You scored <span id="final-score">#</span> out of <span id="max-score">#</span></p>
                
                <!-- Target node for dynamic performance feedback strings -->
                <div id="result-message">Results</div>
            </div>
            
            <!-- Reset trigger: Clears State instances and returns to the initial DOM view -->
            <button id="restart-btn">Restart Quiz</button>
        </div> 
    </div>
    
    <!-- 
      SCRIPT DEPENDENCY TREE
      Scripts must be loaded in strict sequential order to prevent reference errors.
      1. QuizState: Establishes the core data models and logic structures.
      2. UIController: Defines the view rendering and DOM manipulation methods.
      3. Script: The main execution thread that binds state, UI, and event listeners.
    -->
    <script src="QuizState.js"></script>
    <script src="UIController.js"></script>
    <script src="script.js"></script>
</body>
</html>
